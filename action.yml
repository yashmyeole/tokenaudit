# Composite GitHub Action wrapping `tokenaudit check`.
#
# The CLI already appends its markdown summary to $GITHUB_STEP_SUMMARY when
# that variable is set (it is, inside Actions), so the job's summary page
# shows the baseline-vs-current table with no extra wiring here.
name: "tokenaudit check"
description: >-
  Fail a build that silently made LLM prompt caching worse: diagnoses a
  trace run and compares cache health against a baseline committed to
  the repo.
branding:
  icon: "trending-down"
  color: "orange"
inputs:
  traces:
    description: "Trace file or directory to diagnose (OTLP/JSON or OTel SDK JSONL)"
    required: true
  baseline:
    description: "Path to the committed baseline JSON"
    required: false
    default: "tokenaudit-baseline.json"
  max-regression:
    description: "Allowed drop in cache read rate / health floor, in percentage points"
    required: false
    default: "5.0"
  strict:
    description: "Also fail on new non-HIGH findings (true/false)"
    required: false
    default: "false"
  version:
    description: "Install this PyPI release instead of the code at the action's ref"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install tokenaudit
      shell: bash
      env:
        TOKENAUDIT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -n "$TOKENAUDIT_VERSION" ]; then
          python -m pip install --quiet "tokenaudit==$TOKENAUDIT_VERSION"
        else
          python -m pip install --quiet "$ACTION_PATH"
        fi
        tokenaudit --version
    - name: Check for cache cost regression
      shell: bash
      env:
        TRACES: ${{ inputs.traces }}
        BASELINE: ${{ inputs.baseline }}
        MAX_REGRESSION: ${{ inputs.max-regression }}
        STRICT: ${{ inputs.strict }}
      run: |
        extra=""
        if [ "$STRICT" = "true" ]; then extra="--strict"; fi
        tokenaudit check "$TRACES" --baseline "$BASELINE" \
          --max-regression "$MAX_REGRESSION" $extra
